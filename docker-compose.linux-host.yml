# Somente Linux: a API usa a rede do próprio host, para enxergar a rede local de verdade
# (ARP, ping) e capturar pacotes com a libpcap.
#
#   docker compose -f docker-compose.yml -f docker-compose.linux-host.yml up -d --build
#
# Com a rede do host, a API não alcança o banco pelo nome "db"; por isso o banco é publicado em 127.0.0.1:5433.

services:
  db:
    ports:
      - "127.0.0.1:5433:5432"

  api:
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      NETWATCH_DB_URL: jdbc:postgresql://127.0.0.1:5433/netwatch
      NETWATCH_PORT: ${NETWATCH_API_PORT:-8080}
    ports: !reset []

  web:
    environment:
      # O nginx (rede do Docker) chega à API pela rede do host.
      NETWATCH_API_UPSTREAM: host.docker.internal:${NETWATCH_API_PORT:-8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
